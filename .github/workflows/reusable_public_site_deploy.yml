name: Deploy public site
on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment to deploy
        required: true
      cms_url:
        type: string
        description: URL where Strapi is available to generate the static website
        required: true
      backend_url:
        type: string
        description: Pass culture backend URL to fetch playlists from
        required: true
      gcp_project_id:
        type: string
        description: GCP project
        required: true
      cluster_name:
        type: string
        required: true
      cluster_location:
        type: string
        required: true
      namespace:
        type: string
        description: Namespace in which CMS is hosted
        required: true
    secrets:
      SLACK_BOT_TOKEN:
        required: true
        description: A token to send message through slack
      PASSCULTURE_GITHUB_ACTION_APP_ID:
        required: true
        description: "Github Application ID to use to clone other repos"
      PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY:
        required: true
        description: "Private key for the Github application used to clone other repos"

env:
  FIREBASE_CLI_VERSION: 13.0.3

jobs:
  deploy-static-site:
    permissions:
      id-token: write
      contents: read
    environment:
      name: site-instit-${{ inputs.environment }}
      deployment: false
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 
        with:
          node-version: 'v20.20.2'

      - uses: pass-culture/common-workflows/actions/setup-safe-chain@5f7b7837d099ddbb8e4f2e15400434d41d78c51b

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc09333" # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
          service_account: ${{ vars.SITE_INSTIT_CD_SERVICE_ACCOUNT }}

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: Get Secret
        id: "secrets"
        uses: "google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262" # v3.0.0
        with:
          secrets: |-
            IAP_CLIENT_ID:${{ inputs.gcp_project_id }}/passculture-institutional_${{ inputs.environment }}_iap-client-id
            SENTRY_TOKEN:${{ inputs.gcp_project_id }}/passculture-institutional_${{ inputs.environment }}_sentry-token

      - name: Authenticate through github app ghactionci
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        id: github-token
        with:
          app-id: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_ID }}
          private-key: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Liste des repositories à cloner
          repositories: |
            pass-culture-institutional
            pc-connect
            pc-firestore-cli
          permission-contents: write

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc09333" # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
          service_account: ${{ vars.SITE_INSTIT_CD_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: id_token
          id_token_audience: ${{ steps.secrets.outputs.IAP_CLIENT_ID }}
          id_token_include_email: true

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: Authenticate to GKE cluster
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ inputs.cluster_name }}
          project_id: ${{ inputs.gcp_project_id }}
          location: ${{ inputs.cluster_location }}
          use_dns_based_endpoint: true

      # Generate static site into dist folder
      - name: "Install dependencies and build"
        working-directory: public_website
        env:
          NEXT_PUBLIC_STRAPI_API_URL: http://localhost:1337
          NEXT_PUBLIC_BACKEND_API_URL: ${{ inputs.backend_url }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          SENTRY_TOKEN: ${{ steps.secrets.outputs.SENTRY_TOKEN }}
          NAMESPACE: ${{ inputs.namespace }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          kubectl port-forward --namespace "$NAMESPACE" service/site-instit-cms 1337:1337 &
          yarn install
          if [ "$ENVIRONMENT" = "testing" ]; then
            cp testing-robots.txt public/robots.txt
          fi
          yarn build

      - name: "Setup firebase"
        env:
          FIREBASE_CLI_VERSION: ${{ env.FIREBASE_CLI_VERSION }}
        run: |
          npm install -g "firebase-tools@$FIREBASE_CLI_VERSION"

      - name: "Push website to bucket"
        working-directory: public_website
        env:
          ENVIRONMENT: ${{ inputs.environment }} 
        run: |
          firebase use "pc-site-instit-$ENVIRONMENT"
          firebase deploy --only "hosting:$ENVIRONMENT" --project "pc-site-instit-$ENVIRONMENT" --non-interactive

  notification:
    name: "Notification"
    runs-on: ubuntu-22.04
    needs: [deploy-static-site]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: "Post to a Slack channel on success"
        if: ${{ always() && contains(needs.deploy-static-site.result, 'success') }}
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          # channel #alertes-deploiement-site-instit
          channel-id: "C06EKUL552T"
          payload: |
            {
              "attachments": [
                {
                  "mrkdwn_in": ["text"],
                  "color": "#36A64F",
                  "author_name": "${{github.actor}}",
                  "author_link": "https://github.com/${{github.actor}}",
                  "author_icon": "https://github.com/${{github.actor}}.png",
                  "title": "Site instit public",
                  "title_link": "https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}",
                  "text": "Le site instit vient d'être déployé en ${{ inputs.environment }} :white_check_mark:"
                }
              ],
              "unfurl_links": false,
              "unfurl_media": false
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: "Post to a Slack channel on failure"
        if: ${{ always() && contains(needs.deploy-static-site.result, 'failure') }}
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          # channel #alertes-deploiement-site-instit
          channel-id: "C06EKUL552T"
          payload: |
            {
              "attachments": [
                {
                  "mrkdwn_in": ["text"],
                  "color": "#A30002",
                  "author_name": "${{github.actor}}",
                  "author_link": "https://github.com/${{github.actor}}",
                  "author_icon": "https://github.com/${{github.actor}}.png",
                  "title": "Site instit public",
                  "title_link": "https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}",
                  "text": "Le déploiement du site instit vient d'échouer en ${{ inputs.environment }} :boom:"
                }
              ],
              "unfurl_links": false,
              "unfurl_media": false
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
