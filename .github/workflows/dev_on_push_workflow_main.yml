name: "[Merge] Build and deploy on testing"

on:
  push:
    branches:
      - main
    tags: "**"

jobs:
  run_public_website_tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: "public_website/.nvmrc"
      - uses: pass-culture/common-workflows/actions/setup-safe-chain@5f7b7837d099ddbb8e4f2e15400434d41d78c51b
      - name: Install global dependencies
        run: yarn install
      - name: Install public_website dependencies
        run: cd public_website && yarn install
      - name: Lint public_website
        run: cd public_website && yarn test:lint
      - name: Test typescript
        run: cd public_website && yarn test:types
      - name: Test public_website
        run: cd public_website && yarn test
        
  run_content_management_system_tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: "content_management_system/.nvmrc"
      - uses: pass-culture/common-workflows/actions/setup-safe-chain@5f7b7837d099ddbb8e4f2e15400434d41d78c51b
      - name: Install global dependencies
        run: yarn install
      - name: Install content_management_system dependencies
        run: cd content_management_system && yarn install
      - name: Lint content_management_system
        run: cd content_management_system && yarn test:lint
      - name: Test typescript
        run: cd content_management_system && yarn test:types

  build-image-cms:
    runs-on: ubuntu-22.04
    environment:
      name: site-instit-testing
      deployment: false
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
          persist-credentials: false
    - name: Authentification to Google to get secret
      uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc0933' # v3.0.0
      with:
        workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
        service_account: ${{ vars.SITE_INSTIT_CD_SERVICE_ACCOUNT }}
    - name: build image
      id: 'build'
      uses: pass-culture/common-workflows/actions/build-docker-image@main
      with:
        image: pc-institutional 
        push: true 
        context: content_management_system
        gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
        artifact_registry_service_account: ${{ vars.SITE_INSTIT_CD_SERVICE_ACCOUNT }}
        cosign_kms_key: ${{ vars.COSIGN_KMS_KEY }}

  build-image-public-site-preview:
    runs-on: ubuntu-22.04
    environment:
      name: site-instit-testing
      deployment: false
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Authentification to Google to get secret
      uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc0933' # v3.0.0
      with:
        workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
        service_account: ${{ vars.SITE_INSTIT_CD_SERVICE_ACCOUNT }}
    - name: build image
      id: 'build'
      uses: pass-culture/common-workflows/actions/build-docker-image@main
      with:
        image: pc-institutional-public-site-preview
        push: true 
        context: public_website
        gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
        artifact_registry_service_account: ${{ vars.SITE_INSTIT_CD_SERVICE_ACCOUNT }}
        cosign_kms_key: ${{ vars.COSIGN_KMS_KEY }}

  deploy-cms-testing:
    uses: ./.github/workflows/reusable_cms_deploy.yml
    needs:
      - build-image-cms
      - build-image-public-site-preview
    with:
      project_id: passculture-cls-metier-ehp
      environment: testing
      image_tag: ${{ github.sha }}
      cluster_name: cls-metier-ehp
      gcp_project_id: passculture-cls-metier-ehp
      cluster_location: europe-west9
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      PASSCULTURE_GITHUB_ACTION_APP_ID: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_ID }}
      PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY }}

  deploy-public-site-testing:
    needs:
      - deploy-cms-testing
    uses: ./.github/workflows/reusable_public_site_deploy.yml
    with:
      environment: testing
      cms_url: https://siteinstit-cms.testing.passculture.team
      backend_url: https://backend.passculture.app
      gcp_project_id: passculture-cls-metier-ehp
      cluster_name: cls-metier-ehp
      cluster_location: europe-west9
      namespace: site-instit-testing
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      PASSCULTURE_GITHUB_ACTION_APP_ID: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_ID }}
      PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY }}
